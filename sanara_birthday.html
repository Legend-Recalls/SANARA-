<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday, Sanara</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --gold: #f5c842; --gold2: #e8a820;
  --blue: #4a9fd4; --blue2: #2d7db8; --blue3: #1a5a8a;
  --green: #7bc67e; --soft: #fff8f0; --text: #1a1a2e; --muted: #5a6a7a;
}
html, body { width:100%; min-height:100vh; font-family:'Nunito',sans-serif; background-color:var(--soft); color:var(--text); overflow-x:hidden; transition:background-color 2.5s ease, color 2.5s ease; }\r
body.blue-theme { background-color:#eaf3fa; color:#162a42; --text:#162a42; --muted:#647b96; }\r
body.blue-theme .poem-stanza { background-color:#ffffff; color:var(--text); border-left-color:#4a9fd4; box-shadow:0 6px 20px rgba(74, 159, 212, 0.15); }\r
body.blue-theme .poem-stanza.final-stanza { border-left-color:#e8a820; }\r
body.blue-theme .poem-sig { color:#4a9fd4; }\r
body.blue-theme #game-panel { background-color:#ffffff; box-shadow:0 8px 30px rgba(74, 159, 212, 0.15); }\r
body.blue-theme .game-title { color:var(--text); }\r
body.blue-theme .game-desc { color:var(--muted); }\r
body.blue-theme .progress-bar { background-color:rgba(74,159,212,0.15); }

#splash {
  position:fixed; inset:0;
  background:linear-gradient(135deg,#e8f4fd 0%,#fff8f0 50%,#fef6e4 100%);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  z-index:1000; transition:opacity 0.9s ease;
}
#splash.hide { opacity:0; pointer-events:none; }
.splash-title { font-family:'Lora',serif; font-size:clamp(26px,6vw,50px); font-weight:500; color:var(--blue3); text-align:center; line-height:1.3; margin-bottom:0.4rem; }
.start-btn {
  background:var(--blue); color:white; border:none;
  padding:14px 40px; border-radius:50px;
  font-family:'Nunito',sans-serif; font-size:18px; font-weight:800;
  cursor:pointer; box-shadow:0 4px 20px rgba(74,159,212,0.4);
  transition:transform 0.15s,box-shadow 0.15s;
  margin-top:2.2rem;
}
.start-btn:hover { transform:translateY(-2px); box-shadow:0 6px 28px rgba(74,159,212,0.5); }

/* Heart burst overlay */
#heart-overlay {
  position:fixed; inset:0; z-index:2000;
  pointer-events:none;
  opacity:0;
  transition:opacity 0.4s ease;
  overflow:hidden;
}
#heart-overlay.active { opacity:1; }
#heart-overlay.fade-out { opacity:0; transition:opacity 0.8s ease; }
.heart-particle {
  position:absolute;
  font-size:28px;
  opacity:0;
  animation:heartFloat var(--dur,1.4s) var(--delay,0s) ease-out forwards;
  transform-origin:center;
  pointer-events:none;
  user-select:none;
  will-change: transform, opacity;
}
@keyframes heartFloat {
  0%   { opacity:0;  transform:translate3d(0,0,0) scale(0.3) rotate(var(--rot,0deg)); }
  15%  { opacity:1; }
  60%  { opacity:0.9; }
  100% { opacity:0;  transform:translate3d(var(--tx,0px), var(--ty,-200px), 0) scale(1.1) rotate(var(--rot2,20deg)); }
}
.heart-ring {
  position:absolute;
  border:3px solid rgba(255,100,130,0.7);
  border-radius:50%;
  width:0; height:0;
  top:50%; left:50%;
  transform:translate(-50%,-50%);
  animation:ringExpand 1.2s var(--rd,0s) ease-out forwards;
  pointer-events:none;
}
@keyframes ringExpand {
  0%   { width:0;height:0;opacity:0.9;border-width:4px; }
  100% { width:200vmax;height:200vmax;opacity:0;border-width:1px; }
}

#stage { min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:2rem 1rem 4rem; }

.progress-bar { width:min(500px,90vw); height:6px; background:rgba(74,159,212,0.2); border-radius:3px; margin-bottom:2.5rem; overflow:hidden; }
.progress-fill { height:100%; background:var(--blue); border-radius:3px; transition:width 0.6s ease; }

.poem-scroll { width:min(560px,95vw); margin-top:1rem; }
.poem-stanza {
  font-family:'Lora',serif; font-size:clamp(14px,3.5vw,17px); line-height:2;
  color:var(--text); padding:1.2rem 1.4rem;
  border-left:3px solid var(--blue);
  background:white; border-radius:0 12px 12px 0;
  margin-bottom:1rem; opacity:0; transform:translateY(16px);
  transition:opacity 0.7s ease,transform 0.7s ease,background 2.2s ease,color 2.2s ease,border-color 2.2s ease,box-shadow 2.2s ease;
  box-shadow:0 2px 12px rgba(0,0,0,0.06);
}
.poem-stanza.visible { opacity:1; transform:translateY(0); }
.poem-stanza.final-stanza { border-left-color:var(--gold2); font-style:italic; font-size:clamp(15px,3.8vw,19px); }
.poem-sig { text-align:right; font-family:'Lora',serif; font-size:16px; font-weight:500; color:var(--blue3); margin-top:0.5rem; opacity:0; transition:opacity 1s ease 0.5s; }
.poem-sig.visible { opacity:1; }

#game-panel {
  width:min(560px,95vw); min-height:280px;
  background:white; border-radius:20px;
  box-shadow:0 4px 24px rgba(0,0,0,0.08);
  padding:1.8rem; margin-bottom:1.5rem;
  position:relative; overflow:hidden;
  transition:background 2.2s ease,box-shadow 2.2s ease;
}
.game-label { font-size:13px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:var(--blue); margin-bottom:0.6rem; }
.game-title { font-size:20px; font-weight:800; color:var(--text); margin-bottom:0.4rem; }
.game-desc { font-size:14px; color:var(--muted); margin-bottom:1.2rem; line-height:1.6; }

.next-btn {
  background:var(--blue); color:white; border:none;
  padding:11px 28px; border-radius:50px;
  font-family:'Nunito',sans-serif; font-size:15px; font-weight:800;
  cursor:pointer; transition:transform 0.15s,background 0.15s;
  margin-top:1rem; display:none;
}
.next-btn.show { display:inline-block; }
.next-btn:hover { background:var(--blue2); transform:translateY(-1px); }

.skip-btn {
  background:transparent; color:var(--muted); border:2px solid #e0e8f0;
  padding:9px 20px; border-radius:50px;
  font-family:'Nunito',sans-serif; font-size:14px; font-weight:700;
  cursor:pointer; transition:all 0.15s;
  margin-top:1rem; display:none; margin-right:10px;
}
.skip-btn.show { display:inline-block; }
.skip-btn:hover { background:#f0f5fa; border-color:var(--muted); color:var(--text); }

#g1-bar-wrap { width:100%; height:28px; background:#e8f4fd; border-radius:14px; overflow:hidden; margin:1.2rem 0; }
#g1-fill { height:100%; width:0%; background:linear-gradient(90deg,#7bc67e,#4a9fd4,#f5c842); border-radius:14px; display:flex; align-items:center; justify-content:flex-end; padding-right:8px; font-size:13px; font-weight:700; color:white; transition:width 0.1s linear; }
#g1-msg { font-size:15px; color:var(--muted); margin-top:0.5rem; min-height:22px; }

#pencil-arena { width:100%; height:200px; background:linear-gradient(180deg,#e8f4fd 0%,#fff8f0 100%); border-radius:12px; position:relative; overflow:hidden; cursor:crosshair; user-select:none; border:2px dashed #c5dff0; }
.pencil-fall { position:absolute; font-size:26px; cursor:pointer; user-select:none; animation:fall linear forwards; }
@keyframes fall { from{transform:translateY(-40px) rotate(15deg)} to{transform:translateY(230px) rotate(-15deg)} }
#pencil-score { font-size:18px; font-weight:800; color:var(--blue); margin-top:0.5rem; }
#pencil-msg { font-size:14px; color:var(--muted); }

#g3-warmth { font-family:'Lora',serif; font-size:20px; font-style:italic; color:var(--blue3); text-align:center; padding:2rem 1rem; opacity:0; transition:opacity 2s ease; line-height:1.8; }

.color-swatches { display:flex; flex-wrap:wrap; gap:12px; margin:1rem 0; }
.swatch { width:52px; height:52px; border-radius:50%; cursor:pointer; border:3px solid transparent; transition:transform 0.15s,border-color 0.15s; flex-shrink:0; }
.swatch:hover { transform:scale(1.1); }
.swatch.chosen { border-color:var(--text); transform:scale(1.15); }
#color-msg { font-size:15px; color:var(--muted); margin-top:0.5rem; min-height:22px; }

#shield-arena { width:100%; height:180px; background:linear-gradient(135deg,#fef6f0 0%,#fff0f5 100%); border-radius:12px; position:relative; overflow:hidden; border:2px dashed #f5c0c0; cursor:pointer; }
#shield-char { position:absolute; bottom:20px; left:50%; transform:translateX(-50%); font-size:36px; user-select:none; }
.excuse-ball { position:absolute; font-size:13px; font-weight:700; color:white; background:#e05555; border-radius:20px; padding:3px 10px; top:-30px; animation:excuseFall linear forwards; user-select:none; pointer-events:none; }
@keyframes excuseFall { from{top:-30px} to{top:210px} }
#shield-score { font-size:18px; font-weight:800; color:#e05555; margin-top:0.5rem; }
#shield-msg { font-size:14px; color:var(--muted); }

#fog-wrap { position:relative; width:100%; height:120px; border-radius:12px; overflow:hidden; background:#e8f4fd; margin:1rem 0; cursor:crosshair; }
#fog-text { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'Lora',serif; font-size:16px; font-style:italic; color:var(--blue3); text-align:center; padding:1rem; line-height:1.7; }
#fog-canvas { position:absolute; inset:0; cursor:crosshair; }
#fog-progress { font-size:14px; color:var(--muted); margin-top:0.4rem; }

#stars-arena { width:100%; height:180px; background:linear-gradient(135deg,#1a2a4a 0%,#2d5a8a 100%); border-radius:12px; position:relative; overflow:hidden; }
.star-dot { position:absolute; font-size:22px; cursor:pointer; animation:twinkle 1.5s ease-in-out infinite; user-select:none; }
@keyframes twinkle { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(0.8)} }
#stars-count { font-size:18px; font-weight:800; color:var(--gold); margin-top:0.5rem; }

#bike-track { width:100%; height:120px; background:linear-gradient(180deg,#87ceeb 0%,#87ceeb 60%,#7bc67e 60%,#7bc67e 100%); border-radius:12px; position:relative; overflow:hidden; margin:1rem 0; }
#bike-rider { position:absolute; bottom:18px; font-size:30px; user-select:none; transition:left 0.08s linear; }
#road-line { position:absolute; bottom:38px; left:0; right:0; height:3px; background:repeating-linear-gradient(90deg,white 0,white 20px,transparent 20px,transparent 40px); animation:roadMove 0.4s linear infinite; }
@keyframes roadMove { from{background-position:0 0} to{background-position:-40px 0} }
#bike-dist { font-size:17px; font-weight:800; color:var(--blue2); margin-top:0.5rem; }
#bike-msg { font-size:14px; color:var(--muted); }

#promise-seal-btn {
  display:block; margin:1.5rem auto 0;
  background:white; border:3px solid var(--blue); color:var(--blue3);
  padding:14px 36px; border-radius:50px;
  font-family:'Nunito',sans-serif; font-size:18px; font-weight:800;
  cursor:pointer; transition:all 0.3s;
  box-shadow:0 2px 12px rgba(74,159,212,0.2);
}
#promise-seal-btn:hover { background:var(--blue); color:white; }
#promise-seal-btn.sealed { background:var(--gold); border-color:var(--gold2); color:var(--text); cursor:default; transform:scale(1.05); }
#promise-msg { text-align:center; font-size:15px; color:var(--muted); margin-top:1rem; min-height:22px; }

#discord-anim { text-align:center; padding:1.5rem; }
#discord-bubble { display:inline-block; background:#5865F2; color:white; border-radius:50%; width:80px; height:80px; font-size:36px; line-height:80px; text-align:center; margin-bottom:1rem; transform:scale(0.2); opacity:0; transition:transform 1s cubic-bezier(0.34,1.56,0.64,1),opacity 0.5s; }
#discord-msg-row { opacity:0; font-size:14px; color:var(--muted); transition:opacity 1s ease 0.5s; line-height:1.7; }

#final-reveal { text-align:center; padding:2rem 1rem; }
.big-heart { font-size:56px; display:block; animation:heartbeat 1.2s ease-in-out infinite; }
@keyframes heartbeat { 0%,100%{transform:scale(1)} 50%{transform:scale(1.15)} }

#confetti-container { position:fixed; inset:0; pointer-events:none; z-index:999; overflow:hidden; }
.conf-piece { position:absolute; width:10px; height:10px; border-radius:2px; animation:confFall linear forwards; }
@keyframes confFall { 0%{transform:translateY(-20px) rotate(0deg);opacity:1} 100%{transform:translateY(110vh) rotate(720deg);opacity:0} }

.game-btn { border:none; border-radius:50px; font-family:'Nunito',sans-serif; font-weight:800; cursor:pointer; transition:transform 0.15s,opacity 0.15s; }
.game-btn:hover { opacity:0.88; transform:translateY(-1px); }

/* ── Cinematic quote reveal ── */
#quote-cinema {
  position:fixed; inset:0; z-index:4000;
  display:flex; align-items:center; justify-content:center;
  padding:2.5rem;
  pointer-events:none;
  background:rgba(6,10,24,0);
  transition:background 0.55s ease;
}
#quote-cinema.dim   { background:rgba(6,10,24,0.88); }
#quote-cinema.undim { background:rgba(6,10,24,0); transition:background 0.65s ease 0.1s; }
#cinema-text {
  font-family:'Lora',serif;
  font-size:clamp(17px,4vw,26px);
  color:#fff;
  text-align:center;
  line-height:2;
  max-width:580px;
  opacity:0;
  transform:scale(0.88) translateY(18px);
  transition:opacity 0.6s ease, transform 0.6s cubic-bezier(0.22,1,0.36,1);
  text-shadow:0 2px 24px rgba(255,255,255,0.18), 0 0 60px rgba(74,159,212,0.25);
  letter-spacing:0.01em;
}
#cinema-text.show {
  opacity:1;
  transform:scale(1) translateY(0);
}
#cinema-text.pushback {
  opacity:0;
  transform:scale(0.72) translateY(-24px);
  transition:opacity 0.5s ease, transform 0.5s cubic-bezier(0.4,0,1,1);
}
#cinema-line {
  display:block;
  width:0;
  height:1px;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
  margin:1.1rem auto 0;
  transition:width 0.7s ease 0.3s;
}
#cinema-text.show #cinema-line { width:min(260px,60vw); }
</style>
</head>
<body>

<div id="heart-overlay" aria-hidden="true"></div>
<div id="quote-cinema" aria-hidden="true"><div id="cinema-text"><span id="cinema-line"></span></div></div>

<div id="splash">
  <div class="splash-title">Hey, Sanara.</div>
  <div class="splash-title" style="font-style:italic;font-size:clamp(18px,4vw,30px);color:var(--blue);">There&rsquo;s something for you here.</div>
  <button class="start-btn" id="start-btn">Open it</button>
</div>

<div id="confetti-container"></div>

<div id="stage" style="display:none;">
  <div class="progress-bar">
    <div class="progress-fill" id="progress-fill" style="width:0%"></div>
  </div>
  <div class="poem-scroll" id="poem-scroll"></div>
  <div id="game-panel">
    <div class="game-label" id="g-label">Chapter 1</div>
    <div class="game-title" id="g-title"></div>
    <div class="game-desc" id="g-desc"></div>
    <div id="g-area"></div>
    <div style="margin-top:0.5rem;">
      <button class="skip-btn" id="skip-btn">Skip</button>
      <button class="next-btn" id="next-btn">Continue &#x2192;</button>
    </div>
  </div>
</div>

<script src="main.js"></script>
<script src="phases/g0_spring.js"></script>
<script src="phases/g1_pencils.js"></script>
<script src="phases/g2_warmth.js"></script>
<script src="phases/g3_blue.js"></script>
<script src="phases/g4_shield.js"></script>
<script src="phases/g5_fog.js"></script>
<script src="phases/g6_stars.js"></script>
<script src="phases/g7_bike.js"></script>
<script src="phases/g8_promise.js"></script>
<script src="phases/g9_discord.js"></script>
<script src="phases/g10_final.js"></script>
</body>
</html>
